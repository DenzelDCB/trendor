<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deskbuddy Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
            font-size: 1.1em;
        }

        .house {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            min-height: 500px;
            position: relative;
        }

        .house-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .house-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .house-status {
            color: #666;
            font-size: 0.95em;
        }

        .stickmen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stickman-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stickman-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .stickman-card.yellow {
            border-top: 4px solid #ffe66d;
        }

        .stickman-card.red {
            border-top: 4px solid #FF6B6B;
        }

        .stickman-card.blue {
            border-top: 4px solid #74B9FF;
        }

        .stickman-card.green {
            border-top: 4px solid #81EC81;
        }

        .stickman-card.orange {
            border-top: 4px solid #FFA94D;
        }

        .stickman-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stickman-avatar {
            width: 60px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .stickman-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-badge.here {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.away {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.sleeping {
            background: #e7e7ff;
            color: #4a4a8a;
        }

        .stickman-details {
            color: #666;
            font-size: 0.9em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .needs-summary {
            margin-top: 15px;
        }

        .need-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .need-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4 0%, #ffe66d 50%, #ff6b6b 100%);
            transition: width 0.3s ease;
        }

        .location-info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85em;
            color: #555;
        }

        .tab-indicator {
            display: inline-block;
            padding: 6px 12px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .stickman-card.active {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Deskbuddy Home</h1>
        <p class="subtitle">Welcome to the stickmen's home! See where everyone is hanging out.</p>

        <div class="house">
            <div class="house-header">
                <h2 class="house-title">The Stickman House</h2>
                <p class="house-status" id="houseStatus">Loading stickmen...</p>
            </div>

            <div id="stickmenContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">🏡</div>
                    <h3>No stickmen at home yet</h3>
                    <p>Stickmen will appear here when they're active on your tabs.</p>
                </div>
            </div>
        </div>

        <div class="refresh-info">
            <p>🔄 This page updates automatically as stickmen move between tabs.</p>
            <button onclick="window.location.reload()" style="margin-top: 10px; padding: 10px 20px; background: white; color: #667eea; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">
                Refresh Now
            </button>
        </div>
    </div>

    <script>
        // Stickmen home page functionality
        const stickmenContainer = document.getElementById('stickmenContainer');
        const houseStatus = document.getElementById('houseStatus');

        function getStickmanEmoji(color) {
            const emojis = {
                yellow: '💛',
                red: '❤️',
                blue: '💙',
                green: '💚',
                orange: '🧡'
            };
            return emojis[color.toLowerCase()] || '👤';
        }

        function getMoodEmoji(mood) {
            const moods = {
                happy: '😊',
                angry: '😠',
                sad: '😔',
                neutral: '😐',
                surprised: '😲',
                emotional: '🥺'
            };
            return moods[mood] || '😐';
        }

        function getStatusBadge(onThisTab, sleeping) {
            if (sleeping) {
                return '<span class="status-badge sleeping">😴 Sleeping</span>';
            } else if (onThisTab) {
                return '<span class="status-badge here">✓ At Home</span>';
            } else {
                return '<span class="status-badge away">📱 On Another Tab</span>';
            }
        }

        function getNeedPercentage(value) {
            return Math.round(value);
        }

        function renderStickmen(stickmen) {
            if (!stickmen || stickmen.length === 0) {
                stickmenContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏡</div>
                        <h3>No stickmen at home yet</h3>
                        <p>Stickmen will appear here when they're active on your tabs.</p>
                    </div>
                `;
                houseStatus.textContent = 'No stickmen currently active';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'stickmen-grid';

            const hereCount = stickmen.filter(s => s.onThisTab).length;
            houseStatus.textContent = `${stickmen.length} stickman(s) total • ${hereCount} at home right now`;

            stickmen.forEach(stickman => {
                const card = document.createElement('div');
                card.className = `stickman-card ${stickman.id} ${stickman.onThisTab ? 'active' : ''}`;
                
                const avatar = getStickmanEmoji(stickman.id);
                const moodEmoji = getMoodEmoji(stickman.mood || 'neutral');
                const statusBadge = getStatusBadge(stickman.onThisTab, stickman.sleeping);

                const hunger = getNeedPercentage(stickman.needs?.hunger || 50);
                const energy = getNeedPercentage(stickman.needs?.energy || 50);
                const happiness = getNeedPercentage(stickman.needs?.happiness || 50);

                card.innerHTML = `
                    <div class="stickman-header">
                        <div class="stickman-avatar">${avatar}</div>
                        <div class="stickman-info">
                            <h3>${stickman.name || stickman.id} ${moodEmoji}</h3>
                            ${statusBadge}
                        </div>
                    </div>

                    <div class="stickman-details">
                        <div class="detail-row">
                            <span>Health:</span>
                            <span>${stickman.health || 100}%</span>
                        </div>
                        <div class="detail-row">
                            <span>Status:</span>
                            <span>${stickman.alive ? 'Alive' : '💀 Deceased'}</span>
                        </div>
                        ${stickman.onThisTab ? `
                        <div class="location-info">
                            <strong>📍 Currently Here!</strong>
                            <div class="tab-indicator">Tab ${stickman.currentTab || 'Current'}</div>
                        </div>
                        ` : `
                        <div class="location-info">
                            <strong>📱 Away</strong>
                            <div>Wandering on another tab</div>
                        </div>
                        `}
                    </div>

                    <div class="needs-summary">
                        <div class="detail-row">
                            <span>🍽️ Hunger:</span>
                            <span>${hunger}%</span>
                        </div>
                        <div class="need-bar">
                            <div class="need-fill" style="width: ${hunger}%"></div>
                        </div>

                        <div class="detail-row">
                            <span>⚡ Energy:</span>
                            <span>${energy}%</span>
                        </div>
                        <div class="need-bar">
                            <div class="need-fill" style="width: ${energy}%"></div>
                        </div>

                        <div class="detail-row">
                            <span>😊 Happiness:</span>
                            <span>${happiness}%</span>
                        </div>
                        <div class="need-bar">
                            <div class="need-fill" style="width: ${happiness}%"></div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            stickmenContainer.innerHTML = '';
            stickmenContainer.appendChild(grid);
        }

        // Request stickmen data from extension
        function requestStickmenData() {
            // Try to get data from opener or parent if in popup
            if (window.opener || window.parent !== window) {
                window.opener?.postMessage({ type: 'GET_STICKMEN_HOME' }, '*');
                window.parent?.postMessage({ type: 'GET_STICKMEN_HOME' }, '*');
            }

            // Also try chrome.runtime if available
            if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ type: 'GET_STICKMEN' }, (res) => {
                    if (res && res.stickmen) {
                        renderStickmen(res.stickmen);
                    }
                });
            }
        }

        // Listen for messages
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'STICKMEN_DATA') {
                renderStickmen(event.data.stickmen);
            }
        });

        // Initial load
        requestStickmenData();

        // Auto-refresh every 5 seconds
        setInterval(requestStickmenData, 5000);
    </script>
</body>
</html>
